<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const P = new URLSearchParams(location.search);
const VIEW = P.get('view') || 'hero';
const MODEL = P.get('model') || 'comoda'; // comoda | mesa | set
const W = +(P.get('w') || 1600), H = +(P.get('h') || 1200);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
scene.background = new THREE.Color(VIEW === 'exploded' || VIEW === 'step' ? 0xf4f1ec : 0xd9d2c7);

// ---------- textures ----------
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...rep); t.anisotropy = 8; return t;
}
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const tileTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rand(7);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const x = i * w / 2, y = j * h / 2;
    g.fillStyle = `hsl(210, 5%, ${76 + r() * 4}%)`; g.fillRect(x, y, w / 2, h / 2);
    for (let k = 0; k < 40; k++) { // marble veins
      g.strokeStyle = `rgba(150,155,165,${0.08 + r() * 0.12})`; g.lineWidth = 1 + r() * 2;
      g.beginPath(); let px = x + r() * w / 2, py = y + r() * h / 2; g.moveTo(px, py);
      for (let s = 0; s < 6; s++) { px += (r() - .5) * 90; py += (r() - .5) * 90; g.lineTo(Math.min(Math.max(px, x), x + w / 2), Math.min(Math.max(py, y), y + h / 2)); }
      g.stroke();
    }
  }
  g.strokeStyle = '#b9bcc2'; g.lineWidth = 4;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * w / 2, 0); g.lineTo(i * w / 2, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 2); g.lineTo(w, i * h / 2); g.stroke(); }
}, [6, 6]);
function woodTex(base, dark, seed) {
  return canvasTex(512, 2048, (g, w, h) => {
    const r = rand(seed);
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 180; i++) {
      const x = r() * w; g.strokeStyle = dark.replace('A', (0.05 + r() * 0.18).toFixed(2));
      g.lineWidth = 0.5 + r() * 3; g.beginPath(); g.moveTo(x, 0);
      for (let y = 0; y <= h; y += 64) g.lineTo(x + Math.sin(y / 420 + i) * 4 + (r() - .5) * 1.5, y);
      g.stroke();
    }
  });
}
const rovere = woodTex('#d6bd98', 'rgba(125,95,60,A)', 3); // Cartagena (Pelíkano)

// ---------- materials ----------
const M = {
  white: new THREE.MeshStandardMaterial({ color: 0xf3f2ee, roughness: 0.42, metalness: 0 }),
  whiteIn: new THREE.MeshStandardMaterial({ color: 0xe9e8e3, roughness: 0.5 }),
  hdf: new THREE.MeshStandardMaterial({ color: 0xf0efea, roughness: 0.7 }),
  wood: new THREE.MeshStandardMaterial({ map: rovere, roughness: 0.55 }),
  knob: new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.25 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xc9ccd1, roughness: 0.3, metalness: 0.45 }),
  floor: new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.25 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xe3dccf, roughness: 0.95 }),
  shadow: new THREE.ShadowMaterial({ opacity: 0.18 }),
};
const rovereH = rovere.clone(); rovereH.center.set(0.5, 0.5); rovereH.rotation = Math.PI / 2; rovereH.repeat.set(1, 0.6); rovereH.needsUpdate = true;
M.woodH = new THREE.MeshStandardMaterial({ map: rovereH, roughness: 0.55 });
const FRONT = VIEW === 'color' ? M.woodH : M.white;
const DOOR = VIEW === 'color' ? M.wood : M.white;
const TOP = VIEW === 'color' ? M.woodH : M.white;
const SIDE = VIEW === 'color' ? M.wood : M.white;
const PLINTH = VIEW === 'color' ? M.woodH : M.white;

// ---------- helpers (units: mm → m) ----------
const mm = v => v / 1000;
const root = new THREE.Group(); scene.add(root);
let CUR = 0; // paso de armado de la pieza que se está creando
function box(x0, x1, y0, y1, z0, z1, mat, parent = root, r = 0.8) {
  const w = mm(x1 - x0), h = mm(y1 - y0), d = mm(z1 - z0);
  const geo = new RoundedBoxGeometry(w, h, d, 2, Math.min(mm(r), w / 2.1, h / 2.1, d / 2.1));
  const m = new THREE.Mesh(geo, mat);
  m.position.set(mm((x0 + x1) / 2), mm((y0 + y1) / 2), mm((z0 + z1) / 2));
  m.castShadow = m.receiveShadow = true; m.userData.step = CUR; parent.add(m); return m;
}
const starShape = (() => {
  const s = new THREE.Shape(), R = mm(19), r = mm(9);
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? s.lineTo(x, y) : s.moveTo(x, y);
  } s.closePath(); return s;
})();
function knob(x, y, z, parent = root) {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(mm(6), mm(8), mm(14), 20), M.knob);
  stem.rotation.x = Math.PI / 2; stem.position.z = mm(7); g.add(stem);
  const star = new THREE.Mesh(new THREE.ExtrudeGeometry(starShape, { depth: mm(9), bevelEnabled: true, bevelThickness: mm(3), bevelSize: mm(2.5), bevelSegments: 3 }), M.knob);
  star.position.z = mm(14); g.add(star);
  g.children.forEach(c => c.castShadow = true);
  g.userData.step = CUR; g.position.set(mm(x), mm(y), mm(z)); parent.add(g); return g;
}

// ---------- the chest (x: 0..1050 left→right, y: floor up, z: back 0 → front 480) ----------
const EX = VIEW === 'exploded';
const STEP = VIEW === 'step' ? +(P.get('step') || 9) : 99;
const ex = (v) => EX ? v : 0; // explode offsets
// Medidas: 900 x 800 x 400 mm; frentes de cajón 590 x 160
function carcass() {
  CUR = 4; box(0, 900, 785, 800, 0, 400, TOP, root, 2).position.y += mm(ex(240));                   // sobre
  CUR = 2; box(15, 30, 0, 785, 0, 380, SIDE).position.x -= mm(ex(150));                          // costado izq
  box(870, 885, 0, 785, 0, 380, SIDE).position.x += mm(ex(150));                        // costado der
  box(30, 870, 118, 133, 0, 380, VIEW === "color" ? M.woodH : M.whiteIn).position.y -= mm(ex(40));                      // piso
  box(599, 614, 133, 770, 0, 380, M.whiteIn);                                              // división 637
  CUR = 4; box(30, 870, 0, 118, 345, 360, PLINTH).position.set(mm(450), mm(59) - mm(ex(110)), mm(352.5) + mm(ex(180))); // zócalo
  CUR = 2; box(30, 870, 770, 785, 300, 380, M.whiteIn).position.y += mm(ex(130));                   // travesaño frente (acostado)
  box(30, 870, 770, 785, 0, 80, M.whiteIn).position.y += mm(ex(130));                      // travesaño atrás (acostado)
  CUR = 6; box(614, 870, 450, 465, 20, 380, M.whiteIn).position.z += mm(ex(240));                   // repisa
  CUR = 3; const back = box(15, 885, 0, 785, -3, 0, M.hdf, root, 0.3); back.position.z -= mm(ex(220)); // fondo
}
const fronts = [[622, 782], [459, 619], [296, 456], [133, 293]]; // y ranges (from floor)
function drawer(i, pull) {
  const [y0, y1] = fronts[i];
  const g = new THREE.Group(); g.userData.drawer = true; root.add(g);
  const bx0 = 43, bx1 = 586, by0 = y0 + 22, by1 = by0 + 110, bz0 = 30, bz1 = 380;
  CUR = 1;
  box(bx0, bx0 + 15, by0, by1, bz0, bz1, M.whiteIn, g);
  box(bx1 - 15, bx1, by0, by1, bz0, bz1, M.whiteIn, g);
  box(bx0 + 15, bx1 - 15, by0, by1, bz0, bz0 + 15, M.whiteIn, g);
  box(bx0 + 15, bx1 - 15, by0, by1, bz1 - 15, bz1, M.whiteIn, g);
  box(bx0, bx1, by0 - 3, by0, bz0, bz1, M.hdf, g, 0.3);
  CUR = 6; box(15, 605, y0, y1, 380, 395, FRONT, g, 1.2);
  knob(160, (y0 + y1) / 2, 395, g); knob(460, (y0 + y1) / 2, 395, g);
  CUR = 5; box(bx0 - 12, bx0, by0 + 35, by0 + 70, bz0 + 10, bz1 - 10, M.metal, g, 0.5);
  box(bx1, bx1 + 12, by0 + 35, by0 + 70, bz0 + 10, bz1 - 10, M.metal, g, 0.5);
  if (pull > 0) {
    box(30, 34, by0 + 33, by0 + 72, 25, 370, M.metal);
    box(595, 599, by0 + 33, by0 + 72, 25, 370, M.metal);
  }
  g.position.z = mm(pull);
  if (EX) { g.position.z = mm(340 + i * 25); g.position.y = mm((1.5 - i) * 22); }
}
function door(angleDeg) {
  const pivot = new THREE.Group(); pivot.position.set(mm(885), 0, mm(395)); root.add(pivot);
  CUR = 6; const d = box(608, 885, 133, 782, 380, 395, DOOR, pivot, 1.2);
  d.position.x -= mm(885); d.position.z -= mm(395);
  const k = knob(645, 460, 395, pivot); k.position.x -= mm(885); k.position.z -= mm(395);
  for (const hy of [233, 682]) {
    const h = new THREE.Mesh(new THREE.CylinderGeometry(mm(17.5), mm(17.5), mm(3), 24), M.metal);
    h.userData.step = 6; h.rotation.x = Math.PI / 2; h.position.set(mm(840) - mm(885), mm(hy), mm(379) - mm(395)); pivot.add(h);
  }
  pivot.rotation.y = THREE.MathUtils.degToRad(angleDeg);
  if (EX) { pivot.position.x += mm(360); pivot.position.z += mm(280); }
}


// ---------- mesa de noche 400 x 507 x 373 mm (x 0..400, carcasa z 0..358, frentes 358..373) ----------
function mesa(ox, pull) {
  const g = new THREE.Group(); g.position.x = mm(ox); root.add(g);
  const IN = M.whiteIn; // interior blanco (como la Eter)
  CUR = 4; box(0, 400, 492, 507, 0, 373, TOP, g, 2);                  // tapa
  CUR = 2; box(0, 15, 0, 492, 0, 358, SIDE, g);                       // costados
  box(385, 400, 0, 492, 0, 358, SIDE, g);
  box(15, 385, 70, 85, 0, 358, IN, g);                       // piso
  box(15, 385, 347, 362, 0, 358, IN, g);                     // repisa del nicho (nicho libre 130 mm)
  CUR = 4; box(15, 385, 0, 70, 323, 338, PLINTH, g);                  // zócalo 70 retrocedido
  CUR = 2; box(15, 385, 412, 492, 0, 15, M.whiteIn, g);               // travesaño trasero
  CUR = 3; box(0, 400, 0, 492, -3, 0, M.hdf, g, 0.3);                 // fondo
  [[217, 358], [73, 214]].forEach(([y0, y1], i) => {
    const d = new THREE.Group(); d.userData.drawer = true; g.add(d);
    const by0 = y0 + 20, by1 = by0 + 100, bx0 = 28, bx1 = 372, bz0 = 58, bz1 = 358;
    CUR = 1;
    box(bx0, bx0 + 15, by0, by1, bz0, bz1, M.whiteIn, d);
    box(bx1 - 15, bx1, by0, by1, bz0, bz1, M.whiteIn, d);
    box(bx0 + 15, bx1 - 15, by0, by1, bz0, bz0 + 15, M.whiteIn, d);
    box(bx0 + 15, bx1 - 15, by0, by1, bz1 - 15, bz1, M.whiteIn, d);
    box(bx0, bx1, by0 - 3, by0, bz0, bz1, M.hdf, d, 0.3);
    CUR = 5; box(bx0 - 12, bx0, by0 + 30, by0 + 65, bz0 + 10, bz1 - 10, M.metal, d, 0.5);
    box(bx1, bx1 + 12, by0 + 30, by0 + 65, bz0 + 10, bz1 - 10, M.metal, d, 0.5);
    CUR = 6; box(1.5, 398.5, y0, y1, 358, 373, FRONT, d, 1.2);
    knob(200, (y0 + y1) / 2, 373, d);
    if (i === 0 && pull) {
      d.position.z = mm(pull);
      const colors = [0xf2b8c6, 0x8fb3d9];
      colors.forEach((c, k) => box(50 + k * 150, 180 + k * 150, by0, by0 + 40, 90, 330, new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }), d, 10));
    }
  });
  if (VIEW === 'open' || MODEL === 'set') { // libros en el nicho
    [0xd98f6b, 0x7fa7c9, 0xe8d48f].forEach((c, k) => box(40 + k * 32, 68 + k * 32, 362, 362 + 110 - k * 10, 60, 250, new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }), g, 2));
  }
  return g;
}

if (MODEL === 'comoda' || MODEL === 'set') {
carcass();
if (VIEW === 'open') { drawer(0, 180); drawer(1, 300); drawer(2, 0); drawer(3, 100); door(105); }
else { for (let i = 0; i < 4; i++) drawer(i, 0); door(0); }

if (VIEW === 'open') {
  const colors = [0x8fb3d9, 0xf2b8c6, 0xf5e6a8, 0xb9d9b4, 0xd8c4ec];
  const cloth = (x0, x1, y0, h, z0, z1, c, par) => box(x0, x1, y0, y0 + h, z0, z1, new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }), par, 12);
  const g1 = new THREE.Group(); root.add(g1); g1.position.z = mm(300);
  for (let k = 0; k < 3; k++) cloth(65 + k * 170, 220 + k * 170, 459 + 22, 55, 60, 350, colors[k], g1);
  const g2 = new THREE.Group(); root.add(g2); g2.position.z = mm(180);
  for (let k = 0; k < 3; k++) cloth(65 + k * 170, 220 + k * 170, 622 + 22, 45, 60, 350, colors[(k + 2) % 5], g2);
  for (let k = 0; k < 3; k++) cloth(630, 855, 465 + k * 60, 55, 60, 350, colors[(k + 3) % 5], root);
  for (let k = 0; k < 3; k++) cloth(630, 855, 133 + k * 65, 60, 60, 350, colors[k], root);
}

}
if (MODEL === 'mesa') mesa(0, VIEW === 'open' ? 200 : 0);
if (MODEL === 'set') mesa(960, 0);

// ---------- manija de barra (128 mm entre centros) ----------
function manija(x, y, z, parent) {
  const g = new THREE.Group(); g.userData.step = CUR;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(mm(5), mm(5), mm(160), 16), M.metal);
  bar.rotation.z = Math.PI / 2; bar.position.z = mm(28); g.add(bar);
  [-64, 64].forEach(dx => { const p = new THREE.Mesh(new THREE.CylinderGeometry(mm(4), mm(4), mm(28), 12), M.metal); p.rotation.x = Math.PI / 2; p.position.set(mm(dx), 0, mm(14)); g.add(p); });
  g.children.forEach(c => c.castShadow = true);
  g.position.set(mm(x), mm(y), mm(z)); parent.add(g); return g;
}
// ---------- Cómoda Turín 800 x 860 x 400 (2 cajones + 2 puertas, frentes embutidos, sin manijas) ----------
M.black = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.6 });
function pata(x, z, parent) { const m = new THREE.Mesh(new THREE.CylinderGeometry(mm(18), mm(20), mm(25), 20), M.black); m.position.set(mm(x), mm(12.5), mm(z)); m.castShadow = true; m.userData.step = 4; parent.add(m); }
function puertaEmb(parent, x0, x1, y0, y1, hingeX, angle, hinges) {
  const pv = new THREE.Group(); pv.position.set(mm(hingeX), 0, mm(400)); parent.add(pv);
  CUR = 6; const d = box(x0, x1, y0, y1, 385, 400, DOOR, pv, 1.2); d.position.x -= mm(hingeX); d.position.z -= mm(400);
  const cx = hingeX < (x0 + x1) / 2 ? x0 + 22 : x1 - 22;
  for (const hy of hinges) {
    const h = new THREE.Mesh(new THREE.CylinderGeometry(mm(17.5), mm(17.5), mm(3), 24), M.metal);
    h.userData.step = 6; h.rotation.x = Math.PI / 2; h.position.set(mm(cx - hingeX), mm(hy), mm(384 - 400)); pv.add(h);
  }
  pv.rotation.y = THREE.MathUtils.degToRad(angle || 0); return pv;
}
function turin(ox, open) {
  const g = new THREE.Group(); g.position.x = mm(ox); root.add(g);
  [[40, 40], [760, 40], [40, 360], [760, 360]].forEach(([x, z]) => pata(x, z, g));
  CUR = 4; box(0, 800, 845, 860, 0, 400, TOP, g, 2);                                       // T1 tapa
  CUR = 2; box(0, 15, 25, 845, 0, 400, SIDE, g); box(785, 800, 25, 845, 0, 400, SIDE, g);   // T2 costados
  box(15, 785, 25, 40, 0, 400, M.whiteIn, g);                                               // T3 piso
  box(15, 785, 460, 475, 0, 370, M.whiteIn, g);                                             // T4 entrepaño (30 mm atrás)
  box(15, 785, 830, 845, 300, 380, M.whiteIn, g); box(15, 785, 830, 845, 0, 80, M.whiteIn, g); // T5 travesaños
  CUR = 3; box(0, 800, 25, 845, -3, 0, M.hdf, g, 0.3);                                      // TH1 fondo
  CUR = 6; box(15, 785, 250, 265, 20, 370, M.whiteIn, g);                                   // T6 repisa interior
  [[688, 843], [503, 658]].forEach(([y0, y1], i) => {
    const d = new THREE.Group(); d.userData.drawer = true; g.add(d);
    const bx0 = 28, bx1 = 772, by0 = y0 + 20, by1 = by0 + 110, bz0 = 35, bz1 = 385;
    CUR = 1;
    box(bx0, bx0 + 15, by0, by1, bz0, bz1, M.whiteIn, d); box(bx1 - 15, bx1, by0, by1, bz0, bz1, M.whiteIn, d);
    box(bx0 + 15, bx1 - 15, by0, by1, bz0, bz0 + 15, M.whiteIn, d); box(bx0 + 15, bx1 - 15, by0, by1, bz1 - 15, bz1, M.whiteIn, d);
    box(bx0, bx1, by0 - 3, by0, bz0, bz1, M.hdf, d, 0.3);
    CUR = 5; box(bx0 - 12, bx0, by0 + 37, by0 + 72, bz0 + 10, bz1 - 10, M.metal, d, 0.5); box(bx1, bx1 + 12, by0 + 37, by0 + 72, bz0 + 10, bz1 - 10, M.metal, d, 0.5);
    CUR = 6; box(17, 783, y0, y1, 385, 400, FRONT, d, 1.2);
    if (i === 0) { const lk = new THREE.Mesh(new THREE.CylinderGeometry(mm(10), mm(10), mm(6), 20), M.metal); lk.rotation.x = Math.PI / 2; lk.position.set(mm(400), mm(y1 - 28), mm(402)); lk.userData.step = 6; d.add(lk); }
    if (open) { d.position.z = mm(i === 0 ? 180 : 300); [0x8fb3d9, 0xf2b8c6, 0xb9d9b4].forEach((c, k) => box(60 + k * 235, 270 + k * 235, by0, by0 + 60, 70, 360, new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }), d, 12)); }
  });
  puertaEmb(g, 17, 399, 42, 458, 17, open ? -100 : 0, [142, 358]);
  puertaEmb(g, 401, 783, 42, 458, 783, open ? 100 : 0, [142, 358]);
  if (open) [0x6b4f3a, 0x6b4f3a].forEach((c, k) => box(90 + k * 130, 200 + k * 130, 40, 150, 120, 330, new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 }), g, 15));
  return g;
}
// ---------- Nochero Sleep 500 x 520 x 400 (nicho alto + 1 puerta embutida, push, patas) ----------
function sleep(ox, open) {
  const g = new THREE.Group(); g.position.x = mm(ox); root.add(g);
  [[40, 40], [460, 40], [40, 360], [460, 360]].forEach(([x, z]) => pata(x, z, g));
  CUR = 4; box(0, 500, 505, 520, 0, 400, TOP, g, 2);                                       // N1 tapa
  CUR = 2; box(0, 15, 25, 505, 0, 400, SIDE, g); box(485, 500, 25, 505, 0, 400, SIDE, g);   // N2 costados
  box(15, 485, 25, 40, 0, 400, M.whiteIn, g);                                               // N3 piso
  box(15, 485, 300, 315, 0, 400, M.whiteIn, g);                                             // N4 repisa (base del nicho)
  CUR = 3; box(0, 500, 25, 505, -3, 0, M.hdf, g, 0.3);                                      // NH1 fondo
  puertaEmb(g, 17, 483, 42, 298, 483, open ? 100 : 0, [102, 238]);                          // N5 puerta (bisagras a la derecha)
  if (VIEW !== 'step' && (VIEW === 'open' || MODEL === 'set2' || MODEL === 'sleep')) [0xd98f6b, 0x7fa7c9, 0xe8d48f].forEach((c, k2) => box(40 + k2 * 32, 68 + k2 * 32, 315, 315 + 150 - k2 * 12, 60, 260, new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }), g, 2));
  if (open) [0xb9d9b4, 0xd8c4ec].forEach((c, k2) => box(60, 440, 40 + k2 * 55, 90 + k2 * 55, 70, 350, new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }), g, 12));
  return g;
}
if (MODEL === 'turin') turin(0, VIEW === 'open');
if (MODEL === 'sleep') sleep(0, VIEW === 'open');
if (MODEL === 'set2') { turin(0, false); sleep(860, false); }

// ---------- room ----------
if (!EX && VIEW !== 'step') {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), M.floor);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0.5, 0, 1.5); floor.receiveShadow = true; scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), M.wall);
